<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Fashion design poster with a dress, tech pack sheet and colour swatches">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b1a7a"/><stop offset="1" stop-color="#e1457a"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
<filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity=".35"/></filter>
<filter id="sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".25"/></filter>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .9 0"/></filter>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity=".15"/></linearGradient>
<linearGradient id="bars" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#273674"/><stop offset=".5" stop-color="#3c785c"/><stop offset="1" stop-color="#b4daa0"/></linearGradient>
</defs>
<rect width="800" height="600" fill="url(#bg)"/><circle cx="120" cy="80" r="240" fill="#ff8fb8" filter="url(#blur)" opacity="0.9"/><circle cx="720" cy="540" r="260" fill="#7a4bd6" filter="url(#blur)" opacity="0.9"/>
<rect x="60" y="70" width="300" height="440" rx="26" fill="#fff" opacity="1" filter="url(#sh)" transform="rotate(-5 210.0 290.0)"/><g transform="translate(212 120) rotate(-5 0 150)"><path d="M-30 -30 C-40 -50 -10 -60 0 -40" fill="none" stroke="#1b1b1b" stroke-width="4"/><path d="M0 0 C-14 14 -34 18 -42 40 L-30 170 C-60 230 -92 300 -108 380 L108 380 C92 300 60 230 30 170 L42 40 C34 18 14 14 0 0 Z" fill="#e1457a"/><path d="M-42 40 C-10 60 10 60 42 40" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="3" stroke-dasharray="6 5"/><path d="M-30 170 C-10 185 10 185 30 170" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="3" stroke-dasharray="6 5"/></g><rect x="400" y="80" width="340" height="250" rx="22" fill="#f7f1ff" opacity="1" filter="url(#sh)" transform="rotate(4 570.0 205.0)"/><text x="430" y="125" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#6a2fb3" text-anchor="start" letter-spacing="3">TECH PACK</text><rect x="430" y="150" width="260" height="8" rx="4" fill="#c9b6ee"/><rect x="430" y="178" width="230" height="8" rx="4" fill="#c9b6ee"/><rect x="430" y="206" width="200" height="8" rx="4" fill="#c9b6ee"/><rect x="430" y="234" width="170" height="8" rx="4" fill="#c9b6ee"/><rect x="430" y="262" width="140" height="8" rx="4" fill="#c9b6ee"/><path d="M640 150 l30 60 h-60z" fill="none" stroke="#6a2fb3" stroke-width="3" stroke-dasharray="5 4"/><circle cx="440" cy="440" r="30" fill="#e1457a" filter="url(#sh2)"/><circle cx="498" cy="440" r="30" fill="#f4a3c0" filter="url(#sh2)"/><circle cx="556" cy="440" r="30" fill="#6a2fb3" filter="url(#sh2)"/><circle cx="614" cy="440" r="30" fill="#ffd166" filter="url(#sh2)"/><circle cx="672" cy="440" r="30" fill="#0b263d" filter="url(#sh2)"/><text x="440" y="520" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="start" >Autumn collection</text>
<rect width="800" height="600" filter="url(#grain)" opacity=".16" style="mix-blend-mode:overlay"/>
</svg>