<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Website development poster with a browser window and a responsive mobile view">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d1451f"/><stop offset="1" stop-color="#ffb347"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
<filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity=".35"/></filter>
<filter id="sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".25"/></filter>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .9 0"/></filter>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity=".15"/></linearGradient>
<linearGradient id="bars" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#273674"/><stop offset=".5" stop-color="#3c785c"/><stop offset="1" stop-color="#b4daa0"/></linearGradient>
</defs>
<rect width="800" height="600" fill="url(#bg)"/><circle cx="90" cy="520" r="260" fill="#ff3d77" filter="url(#blur)" opacity="0.7"/><circle cx="720" cy="60" r="220" fill="#fff1b0" filter="url(#blur)" opacity="0.8"/>
<rect x="70" y="90" width="520" height="360" rx="20" fill="#fff" opacity="1" filter="url(#sh)" transform="rotate(-3 330.0 270.0)"/><g transform="rotate(-3 330 270)"><rect x="70" y="90" width="520" height="40" rx="20" fill="#f0e6dc"/><circle cx="98" cy="110" r="6" fill="#ff6b5b"/><circle cx="118" cy="110" r="6" fill="#ffc044"/><circle cx="138" cy="110" r="6" fill="#4cd07d"/><rect x="170" y="100" width="260" height="20" rx="10" fill="#fff"/><rect x="95" y="155" width="270" height="26" rx="8" fill="#0b263d"/><rect x="95" y="192" width="220" height="26" rx="8" fill="#0b263d"/><rect x="95" y="236" width="250" height="10" rx="5" fill="#c8c0b8"/><rect x="95" y="256" width="200" height="10" rx="5" fill="#c8c0b8"/><rect x="95" y="288" width="110" height="38" rx="19" fill="#ff7a3d"/><rect x="390" y="150" width="170" height="170" rx="22" fill="#ffd166"/><circle cx="475" cy="235" r="50" fill="#ff7a3d"/><rect x="95" y="352" width="140" height="72" rx="14" fill="#fff3e6"/><rect x="250" y="352" width="140" height="72" rx="14" fill="#e6f3ec"/><rect x="405" y="352" width="140" height="72" rx="14" fill="#e6eef9"/></g><rect x="530" y="250" width="170" height="300" rx="30" fill="#0b263d" opacity="1" filter="url(#sh)" transform="rotate(6 615.0 400.0)"/><g transform="rotate(6 615 400)"><rect x="548" y="282" width="134" height="26" rx="8" fill="#ff7a3d"/><rect x="548" y="322" width="134" height="86" rx="14" fill="#ffd166"/><rect x="548" y="420" width="134" height="14" rx="7" fill="#fff" opacity=".3"/><rect x="548" y="444" width="100" height="14" rx="7" fill="#fff" opacity=".3"/><rect x="548" y="480" width="134" height="34" rx="17" fill="#68bd6b"/></g><text x="80" y="520" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#fff" text-anchor="start" opacity=".9">&lt;/&gt;</text><text x="170" y="520" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#fff" text-anchor="start" >Shopify + Custom</text>
<rect width="800" height="600" filter="url(#grain)" opacity=".16" style="mix-blend-mode:overlay"/>
</svg>