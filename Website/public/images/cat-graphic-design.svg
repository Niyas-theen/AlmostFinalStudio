<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Graphic design poster with brand identity cards, type specimen and colour palette">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f5e4a"/><stop offset="1" stop-color="#68bd6b"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
<filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity=".35"/></filter>
<filter id="sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".25"/></filter>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .9 0"/></filter>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity=".15"/></linearGradient>
<linearGradient id="bars" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#273674"/><stop offset=".5" stop-color="#3c785c"/><stop offset="1" stop-color="#b4daa0"/></linearGradient>
</defs>
<rect width="800" height="600" fill="url(#bg)"/><circle cx="100" cy="100" r="220" fill="#a6e6a0" filter="url(#blur)" opacity="0.8"/><circle cx="700" cy="520" r="260" fill="#075392" filter="url(#blur)" opacity="0.8"/>
<rect x="70" y="120" width="330" height="330" rx="34" fill="#0b263d" opacity="1" filter="url(#sh)" transform="rotate(-6 235.0 285.0)"/><rect x="122" y="190" width="17" height="190" rx="3" fill="#273674"/><rect x="151" y="190" width="17" height="190" rx="3" fill="#1d4a6e"/><rect x="180" y="190" width="17" height="190" rx="3" fill="#316564"/><rect x="209" y="190" width="17" height="190" rx="3" fill="#3c785c"/><rect x="238" y="190" width="17" height="190" rx="3" fill="#478f53"/><rect x="267" y="190" width="17" height="190" rx="3" fill="#56a54b"/><rect x="296" y="190" width="17" height="190" rx="3" fill="#7fc467"/><rect x="325" y="190" width="17" height="190" rx="3" fill="#b4daa0"/><rect x="354" y="190" width="17" height="190" rx="3" fill="#edf6e8"/><text x="122" y="420" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="start" letter-spacing="4">ALMOST</text><rect x="380" y="90" width="330" height="200" rx="22" fill="#fff" opacity="1" filter="url(#sh)" transform="rotate(5 545.0 190.0)"/><circle cx="440" cy="190" r="34" fill="#68bd6b"/><circle cx="472" cy="190" r="34" fill="#075392" opacity=".85"/><text x="530" y="180" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#0b263d" text-anchor="start" >Brand</text><text x="530" y="210" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#0b263d" text-anchor="start" >Identity</text><rect x="420" y="320" width="280" height="170" rx="20" fill="#f4f1e6" opacity="1" filter="url(#sh)" transform="rotate(-4 560.0 405.0)"/><text x="445" y="420" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="90" font-weight="700" fill="#0b263d" text-anchor="start" >Aa</text><text x="600" y="380" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#3a8b7e" text-anchor="start" >Type</text><text x="600" y="405" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#3a8b7e" text-anchor="start" >Grid</text><text x="600" y="430" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#3a8b7e" text-anchor="start" >Colour</text><circle cx="110" cy="505" r="22" fill="#0b263d" filter="url(#sh2)"/><circle cx="164" cy="505" r="22" fill="#075392" filter="url(#sh2)"/><circle cx="218" cy="505" r="22" fill="#3a8b7e" filter="url(#sh2)"/><circle cx="272" cy="505" r="22" fill="#68bd6b" filter="url(#sh2)"/><circle cx="326" cy="505" r="22" fill="#edf6e8" filter="url(#sh2)"/>
<rect width="800" height="600" filter="url(#grain)" opacity=".16" style="mix-blend-mode:overlay"/>
</svg>