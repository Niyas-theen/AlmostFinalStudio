<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="UI and UX design poster with app screens, wireframe cards and component chips">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a1768"/><stop offset="1" stop-color="#7a4bd6"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
<filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity=".35"/></filter>
<filter id="sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".25"/></filter>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .9 0"/></filter>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity=".15"/></linearGradient>
<linearGradient id="bars" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#273674"/><stop offset=".5" stop-color="#3c785c"/><stop offset="1" stop-color="#b4daa0"/></linearGradient>
</defs>
<rect width="800" height="600" fill="url(#bg)"/><circle cx="680" cy="80" r="240" fill="#38c6ff" filter="url(#blur)" opacity="0.6"/><circle cx="120" cy="560" r="240" fill="#ff7ab6" filter="url(#blur)" opacity="0.7"/>
<rect x="80" y="80" width="250" height="430" rx="36" fill="#fff" opacity="1" filter="url(#sh)" transform="rotate(-4 205.0 295.0)"/><rect x="100" y="110" width="210" height="90" rx="18" fill="#efe9ff" opacity="1" filter="url(#sh2)" transform="rotate(-4 205.0 155.0)"/><rect x="104" y="225" width="190" height="52" rx="14" fill="#ddd1ff" transform="rotate(-4 205 250)"/><rect x="106" y="295" width="190" height="52" rx="14" fill="#f2eefc" transform="rotate(-4 205 320)"/><rect x="108" y="365" width="190" height="52" rx="14" fill="#ddd1ff" transform="rotate(-4 205 390)"/><circle cx="215" cy="460" r="22" fill="#7a4bd6"/><rect x="380" y="110" width="340" height="230" rx="24" fill="#1a1140" opacity="1" filter="url(#sh)" transform="rotate(3 550.0 225.0)"/><rect x="405" y="140" width="120" height="14" rx="7" fill="#7a4bd6"/><rect x="405" y="175" width="290" height="22" rx="8" fill="#ffffff" opacity=".14"/><rect x="405" y="213" width="240" height="22" rx="8" fill="#ffffff" opacity=".14"/><rect x="405" y="251" width="190" height="22" rx="8" fill="#ffffff" opacity=".14"/><rect x="405" y="295" width="110" height="32" rx="16" fill="#ff7ab6"/><g transform="rotate(-3 560.0 435.0)"><rect x="420" y="370" width="280" height="130" rx="24" fill="url(#glass)" stroke="#fff" stroke-opacity=".6" filter="url(#sh2)"/></g><rect x="445" y="405" width="46" height="46" rx="14" fill="#ff7ab6"/><rect x="507" y="405" width="46" height="46" rx="14" fill="#7a4bd6"/><rect x="569" y="405" width="46" height="46" rx="14" fill="#38c6ff"/><rect x="631" y="405" width="46" height="46" rx="14" fill="#ffd166"/><path d="M640 300 l0 54 l14 -12 l12 26 l10 -5 l-12 -25 l18 -2z" fill="#fff" stroke="#111" stroke-width="2" filter="url(#sh2)"/>
<rect width="800" height="600" filter="url(#grain)" opacity=".16" style="mix-blend-mode:overlay"/>
