<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Mobile app development poster with two angled phones showing app screens">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a4f6b"/><stop offset="1" stop-color="#1fd1c1"/></linearGradient>
