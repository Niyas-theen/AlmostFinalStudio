</defs>
<rect width="800" height="600" fill="url(#bg)"/><circle cx="120" cy="90" r="240" fill="#7ef0e4" filter="url(#blur)" opacity="0.7"/><circle cx="700" cy="560" r="250" fill="#7a4bd6" filter="url(#blur)" opacity="0.7"/>
